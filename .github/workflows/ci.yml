name: CI

on:
  push:
    branches: 
      - main
      - gj/*
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  configuration-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install configuration-only distribution
        run: |
          pip install .
          pip check
      - name: Validate installed package outside the checkout
        working-directory: /tmp
        run: |
          algorithms-job --validate --config "$GITHUB_WORKSPACE/configs/config.yaml"
          algorithms-job --validate --config "$GITHUB_WORKSPACE/configs/templates/dynamic/transformer_ppo_entity_dynamic.yaml"
          python -c 'import sys; from algorithms.configuration.project import validate_config; assert not ({"torch", "citylearn", "mlflow", "numpy"} & sys.modules.keys())'
  test:
    runs-on: ubuntu-latest
    env:
      SIMULATOR_REPO: ${{ github.workspace }}/.ci/Simulator
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4
      - name: Checkout Simulator 1.9.1 benchmark data
        uses: actions/checkout@v4
        with:
          repository: Soft-CPS-Research-Group/Simulator
          # Exact source commit used to publish softcpsrecsimulator 1.9.1.
          # The inherited upstream repository already owns an unrelated v1.8.0 tag.
          ref: dae69ec3ad2e0b11bd580221b41db8b47b7a5a04
          path: .ci/Simulator
          # Source attestation plus the exact fixtures exercised by this suite.
          sparse-checkout: |
            citylearn
            tests/data/minute_ev_demo
            data/datasets/rec_pt_2023_micro_4_v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -e . --no-deps
          pip install ruff==0.11.13 mypy==1.15.0 types-PyYAML==6.0.12.20240917
      - name: Lint / syntax check
        run: |
          python -m compileall run_experiment.py algorithms utils reward_function scripts
          ruff check
          ruff format --check
          mypy
      - name: Run tests
        run: pytest
      - name: Run consolidated agent job contracts
        run: pytest -o addopts="" tests/e2e/test_e2e_consolidated_agents.py tests/e2e/test_baseline_semantics.py tests/e2e/test_common_job_profiles.py tests/e2e/test_runtime_reliability.py tests/e2e/test_export_contract.py

  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
      - name: Create readable image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          slug="$(printf '%s' "${subject}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-72 \
            | sed -E 's/-+$//')"
          if [ -z "${slug}" ]; then
            slug="version"
          fi
          tag="${slug}-${GITHUB_SHA::7}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Image version: ${tag}"

  docker:
    if: github.event_name == 'push'
    needs: [test, version]
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: calof/opeva_simulator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push Docker image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: ALGORITHMS_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=calof/opeva_simulator:buildcache
          cache-to: type=registry,ref=calof/opeva_simulator:buildcache,mode=max

  jetson_docker:
    # L4T r35 Python 3.8 cannot install the supported Python >=3.10 runtime.
    # Preserve the last working legacy tag until its platform migration is validated.
    if: ${{ false }}
    needs: [test, version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata for Jetson
        id: meta_jetson
        uses: docker/metadata-action@v5
        with:
          images: calof/opeva_simulator
          tags: |
            type=raw,value=latest-jetson-r35.3.1,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.tag }}-jetson-r35.3.1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Jetson Xavier L4T 35.3.1 PyTorch CUDA image
      - name: Build and push Jetson Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: ALGORITHMS_COMMIT=${{ github.sha }}
          file: Dockerfile.jetson
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta_jetson.outputs.tags }}
          labels: ${{ steps.meta_jetson.outputs.labels }}
          cache-from: type=registry,ref=calof/opeva_simulator:buildcache-jetson-r35.3.1
          cache-to: type=registry,ref=calof/opeva_simulator:buildcache-jetson-r35.3.1,mode=max

  union_docker:
    if: github.event_name == 'push'
    needs: [test, version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata for Union Blackwell
        id: meta_union
        uses: docker/metadata-action@v5
        with:
          images: calof/opeva_simulator
          tags: |
            type=raw,value=latest-union-blackwell,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.tag }}-union-blackwell
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=OPEVA Algorithms for Union Blackwell GPUs
      - name: Build and push Union Blackwell image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: ALGORITHMS_COMMIT=${{ github.sha }}
          file: Dockerfile.union
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_union.outputs.tags }}
          labels: ${{ steps.meta_union.outputs.labels }}
          cache-from: type=registry,ref=calof/opeva_simulator:buildcache-union-blackwell
          cache-to: type=registry,ref=calof/opeva_simulator:buildcache-union-blackwell,mode=max

  sif:
    if: github.event_name == 'push'
    needs: [docker, version]
    runs-on: ubuntu-latest
    env:
      SOURCE_IMAGE_REPO: calof/opeva_simulator
      SIF_ARTIFACT_REPO: calof/opeva_simulator_sif

    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata (SIF tags)
        id: meta_sif
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SOURCE_IMAGE_REPO }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Install ORAS CLI
        run: |
          ORAS_VERSION="1.2.3"
          curl -sSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" -o oras.tgz
          tar -xzf oras.tgz oras
          sudo mv oras /usr/local/bin/oras
          oras version

      - name: Log in to Docker Hub (for ORAS push)
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | oras login docker.io --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and publish SIF OCI artifacts
        env:
          DOCKER_TAGS: ${{ steps.meta_sif.outputs.tags }}
          # The CUDA image exceeds the RAM-backed /tmp quota on newer runners.
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer-build
        run: |
          set -euo pipefail
          mkdir -p "${APPTAINER_TMPDIR}"

          mapfile -t refs < <(printf '%s\n' "${DOCKER_TAGS}" | tr ',' '\n' | sed '/^[[:space:]]*$/d')
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No Docker tags received from metadata output."
            exit 1
          fi

          declare -A seen
          for ref in "${refs[@]}"; do
            if [[ "${ref}" != "${SOURCE_IMAGE_REPO}:"* ]]; then
              continue
            fi
            tag="${ref#${SOURCE_IMAGE_REPO}:}"
            if [ -z "${tag}" ] || [ -n "${seen[${tag}]:-}" ]; then
              continue
            fi
            if [ "${tag}" = "latest" ]; then
              echo "Skipping SIF build for latest tag."
              continue
            fi
            seen["${tag}"]=1

            echo "Building SIF for ${SOURCE_IMAGE_REPO}:${tag}"
            rm -f simulator.sif
            apptainer build --force simulator.sif "docker://${SOURCE_IMAGE_REPO}:${tag}"

            echo "Publishing OCI artifact ${SIF_ARTIFACT_REPO}:${tag}"
            oras push "docker.io/${SIF_ARTIFACT_REPO}:${tag}" \
              --artifact-type application/vnd.opeva.sif.v1+file \
              simulator.sif:application/vnd.opeva.sif
          done
