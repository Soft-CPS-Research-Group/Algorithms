[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "energaize-algorithms"
version = "0.2.0"
description = "Common experiment runtime and agent catalogue for energAIze"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["pydantic==2.7.1", "PyYAML==6.0.2", "loguru==0.7.3", "typing_extensions==4.12.2"]

[project.optional-dependencies]
training = ["softcpsrecsimulator==1.8.3", "torch==2.5.1", "torchvision==0.20.1", "numpy==1.26.4", "psutil==7.0.0"]
export = ["onnx==1.17.0"]
tracking = ["mlflow==2.19.0"]
offline = ["pyarrow==18.1.0", "pandas==2.2.3"]
solver = ["scipy==1.15.1", "pandas==2.2.3"]
dev = ["pytest==8.3.2", "onnxruntime==1.20.1", "ruff==0.11.13", "mypy==1.15.0", "build==1.2.2.post1", "types-PyYAML==6.0.12.20240917"]

[project.scripts]
algorithms-job = "algorithms.runtime.cli:cli_main"

[tool.setuptools]
py-modules = ["run_experiment"]

[tool.setuptools.packages.find]
include = ["algorithms*", "utils*", "reward_function*", "configs*"]
exclude = ["tests*", "scripts*", "datasets*"]
namespaces = true

[tool.setuptools.package-data]
configs = ["**/*.json", "**/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["algorithms/runtime/*.py", "algorithms/configuration/*.py", "algorithms/contracts.py", "algorithms/catalogue.py", "algorithms/registry.py", "algorithms/execution_unit.py", "algorithms/pipeline.py", "algorithms/agents/environment_validation.py", "tests/test_common_runtime_contract.py", "tests/test_runtime_reliability.py", "tests/e2e/test_runtime_reliability.py", "tests/e2e/test_common_job_profiles.py"]

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"algorithms/runtime/job.py" = ["E402", "F401"]
"algorithms/runtime/controller.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["algorithms/contracts.py", "algorithms/catalogue.py", "algorithms/runtime/context.py", "algorithms/runtime/interaction.py", "algorithms/configuration/migration.py"]
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
