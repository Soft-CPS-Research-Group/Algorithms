version: ti_marl_selection_rules_v1
profile: portugal-evaluation-v2
scope: nominal feasible development only; outage, fault and impossible-DR strata assessed separately
required_metrics:
  - cost_eur
  - electrical_violation_kwh
  - ev_min_acceptable_feasible_rate
  - ev_within_tolerance_feasible_rate
  - deferrable_service_level_rate
  - deferrable_missed_cycles_count
  - deferrable_unserved_energy_kwh
  - peak_daily_ratio_to_bau
  - ramping_ratio_to_bau
  - solar_self_consumption_rate
  - soc_bound_violations
  - energy_balance_residual_kwh
  - external_trip_unserved_kwh
aggregation:
  cost_eur: sum
  electrical_violation_kwh: sum
  ev_min_acceptable_feasible_rate: min
  ev_within_tolerance_feasible_rate: min
  deferrable_service_level_rate: min
  deferrable_missed_cycles_count: sum
  deferrable_unserved_energy_kwh: sum
hard_gates:
  electrical_violation_kwh: {max: 0.000001}
  ev_min_acceptable_feasible_rate: {min: 0.99}
  deferrable_missed_cycles_count: {max: 0}
  deferrable_unserved_energy_kwh: {max: 0.000001}
  soc_bound_violations: {max: 0}
  energy_balance_residual_kwh: {max: 0.00001}
  external_trip_unserved_kwh: {max: 0.000001}
reference_guardrails:
  ev_within_tolerance_feasible_rate: {max_absolute_decrease: 0.0}
  peak_daily_ratio_to_bau: {max_relative_increase: 0.05}
  ramping_ratio_to_bau: {max_relative_increase: 0.05}
  solar_self_consumption_rate: {max_absolute_decrease: 0.02}
  deferrable_service_level_rate: {max_absolute_decrease: 0.0}
promotion:
  metric: cost_eur
  direction: minimize
  minimum_improvement: 0.01
  minimum_relative_improvement: 0.001
tie_breakers:
  - {metric: peak_daily_ratio_to_bau, direction: minimize}
  - {metric: ramping_ratio_to_bau, direction: minimize}
  - {metric: solar_self_consumption_rate, direction: maximize}
