schema_version: algorithms.config.v1
metadata:
  experiment_name: TI-MARL Core-30
  run_name: V2 frozen household evaluation
runtime:
  torch_num_threads: 1
tracking:
  mlflow_enabled: false
  system_metrics_enabled: false
simulator:
  dataset_name: pt_rec_30
  dataset_path: datasets/pt_rec_30/evaluation/rec_30_normal.json
  interface: entity
  central_agent: false
  topology_mode: static
  entity_encoding:
    enabled: false
  reward_function: IndividualScorecardAlignedRewardV3
  simulation_start_time_step: 836
  simulation_end_time_step: 852
  episode_time_steps: 17
  repeat_episode_scenario: true
  export:
    profile: final
    mode: end
    include_business_as_usual: false
training:
  episodes: 0
  seed: 42
  determinism: strict
  steps_between_training_updates: 1
pipeline:
  - algorithm: TIMARL
    count: 1
    hyperparameters:
      method_variant: v2
      typed_interfaces_dir: runs/ti-marl-inputs/interfaces
      simulator_bindings_path: runs/ti-marl-inputs/interfaces/technology_bindings/simulator.yaml
      issued_forecasts_path: runs/ti-marl-inputs/forecasts.jsonl
      operating_reward: thesis_common_reward_v1
      reference_sites: 30
      backbone: {name: mappo}
      critic: {kind: set}
      actor: {readout: household_start, d_model: 128, attention_heads: 4, relation_layers: 2, group_context_kind: action_conditioned}
      departure_margin_seconds: 900
      reward_penalties:
        ev_tolerance_kwh: 1.0
        ev_excess_kwh: 0.05
      rollout_steps: 4
      ppo_epochs: 1
      gamma: 0.99
      discount_timebase_seconds: 3600
checkpointing:
  resume_training: true
  checkpoint_local_path: runs/ti-marl-inputs/frozen/checkpoint.pth
evaluation:
  episodes: 1
job:
  profile: evaluate
outputs:
  model_artifacts: both
bundle:
  require_deployable: false
