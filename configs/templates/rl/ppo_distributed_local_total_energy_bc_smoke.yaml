metadata:
  experiment_name: "ppo_distributed_local_total_energy_bc_smoke"
  run_name: "PPO autonomous-rollout local total-energy BC smoke"
  community_name: "citylearn_static_15min"
  description: >-
    Seventeen independent building-local PPO actors execute autonomously behind
    the local safety shield. The corrected individual total-energy schedule is
    queried only for auxiliary behavior-cloning labels and never replaces a
    runtime action.

tracking:
  mlflow_enabled: false
  log_level: "INFO"
  log_frequency: 168
  mlflow_step_sample_interval: 84
  progress_update_interval: 168
  action_diagnostics_enabled: true
  training_diagnostics_enabled: true
  training_diagnostics_detail: summary
  reward_diagnostics_enabled: true
  reward_diagnostics_detail: summary
  tags:
    evidence_horizon: "week1_right_boundary_truncated_smoke"
    benchmark_track: "building_local_retail"
    controller_scope: "seventeen_independent_building_local_actors"
    rollout_behavior: "autonomous_actor_plus_local_safety"
    learning_supervision: "individual_total_energy_demonstration_bc"
    perfect_foresight_training_labels: true
    runtime_service_teacher: false
    diagnostic_only: true
    local_price_conditioning_ready: true

checkpointing:
  resume_training: false
  checkpoint_artifact: "latest_checkpoint.pth"
  reset_replay_buffer: false
  freeze_pretrained_layers: false
  fine_tune: false
  restore_optimizers: true
  restore_replay_buffer: true
  restore_exploration_state: false
  restore_reward_normalizer: false
  checkpoint_interval: 672

simulator:
  dataset_name: citylearn_three_phase_electrical_service_demo_15min_parquet
  dataset_path: ./datasets/citylearn_three_phase_electrical_service_demo_15min_parquet/schema.json
  central_agent: false
  interface: entity
  topology_mode: static
  entity_encoding:
    enabled: true
    normalization: minmax_space
    profile: building_local_v1
    clip: true
  community_market:
    enabled: false
    local_price_ratio_to_grid_import: 0.8
    intra_community_sell_ratio: 0.8
    grid_export_price: 0.0
    import_member_weights: {}
    kpis:
      community_local_traded_enabled: false
      community_self_consumption_enabled: true
  reward_function: LocalEconomicSafetyRewardV3
  reward_function_kwargs:
    reward_scale: 0.01
  # This packaged schedule is diagnostic-only because eight EV sessions cross
  # the right boundary. Keep this window exact; use a boundary-exact schedule
  # before model selection or promotion.
  episodes: 4
  deterministic_finish: true
  simulation_start_time_step: 0
  simulation_end_time_step: 672
  episode_time_steps: 673
  export:
    mode: end
    export_kpis_on_episode_end: true
    final_episode_only: true
    kpis_final_episode_only: true
    timeseries_final_episode_only: true
    include_business_as_usual: true
    export_business_as_usual_timeseries: false
    session_name: "ppo-local-total-energy-bc-autonomous-smoke"

training:
  seed: 123
  steps_between_training_updates: 1
  target_update_interval: 0

topology:
  num_agents: null
  observation_dimensions: null
  action_dimensions: null
  action_space: null

pipeline:
  - algorithm: PPO
    count: 17
    hyperparameters:
      gamma: 0.995
      require_cuda: false
    networks:
      actor:
        class: Actor
        layers: [256, 256]
        lr: 3.0e-4
      critic:
        class: Critic
        layers: [256, 256]
        lr: 1.0e-3
    replay_buffer:
      class: OnPolicyRolloutBuffer
      capacity: 336
      batch_size: 128
    exploration:
      strategy: PPO
      params:
        rollout_length: 336
        minibatch_size: 128
        ppo_epochs: 4
        gae_lambda: 0.95
        clip_ratio: 0.2
        entropy_coef: 0.001
        value_loss_coef: 0.5
        max_grad_norm: 0.5
        initial_log_std: -2.5
        min_log_std: -5.0
        max_log_std: -0.5
        target_kl: 0.03

        # A policy teacher is initialized only so it can label the actor's own
        # states. With both action-control horizons at zero, it never selects or
        # blends an environment action.
        initial_exploration_strategy: policy
        warm_start_policy: TotalOracleReplayPolicy
        warm_start_policy_deterministic: true
        warm_start_policy_noise_scale: 0.0
        warm_start_policy_hyperparameters:
          schedule_path: ./configs/demonstrations/local_total_energy_v1/week1_corrected_soc_diagnostic/replay_schedule.json
          allow_attached_action_subset: true
          repeat_schedule_for_training: true
        end_initial_exploration_time_step: 0
        random_exploration_steps: 0
        warm_start_policy_phaseout_steps: 0
        warm_start_policy_phaseout_mode: probability
        train_during_initial_exploration: true
        initial_exploration_training_start_step: 0

        actor_behavior_cloning_weight: 2.0
        actor_behavior_cloning_min_weight: 0.25
        actor_behavior_cloning_decay_start_step: 672
        actor_behavior_cloning_decay_steps: 2016
        actor_behavior_cloning_extra_updates: 2
        actor_behavior_cloning_extra_update_start_step: 0
        actor_behavior_cloning_extra_update_end_step: 2016
        actor_behavior_cloning_replay_capacity: 2048
        actor_ev_behavior_cloning_multiplier: 1.0
        actor_ev_behavior_cloning_positive_target_weight: 4.0
        actor_ev_behavior_cloning_zero_target_weight: 1.0
        actor_storage_behavior_cloning_multiplier: 1.0
        actor_deferrable_behavior_cloning_multiplier: 2.0
        actor_deferrable_behavior_cloning_positive_target_weight: 12.0
        actor_other_behavior_cloning_multiplier: 1.0

        local_action_safety_enabled: true
        local_action_safety_fail_on_infeasible: false
        # Match the 0.1 kW reserve used by the replay-validated MILP and avoid
        # simulator float/phase rounding when a projected action lands exactly
        # on the 12/7/5 kW Building_15 limits.
        local_action_safety_headroom_reserve_kw: 0.1
        local_action_safety_protect_ev_minimum: true
        local_action_safety_ev_minimum_mode: deadline_feasible
        local_action_safety_protect_ev_service_target: true
        local_action_safety_allow_discretionary_deferrable_start: false
        local_action_safety_service_teacher_enabled: false
        local_action_safety_service_teacher_eval_enabled: false
        local_action_safety_runtime_only_export: true
        local_price_conditioning_enabled: true
        local_price_forecast_mode: real_unmodified

execution: null
