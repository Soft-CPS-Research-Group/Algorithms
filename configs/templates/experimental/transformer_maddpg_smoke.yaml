schema_version: algorithms.config.v1
# Short integration check; not a model-quality benchmark.
metadata:
  experiment_name: consolidation_smoke
  run_name: transformer_maddpg_smoke
  community_name: two-buildings
tracking:
  mlflow_enabled: false
  log_level: WARNING
  log_frequency: 64
  progress_update_interval: 64
simulator:
  dataset_name: citylearn_three_phase_electrical_service_demo
  dataset_path: ./datasets/citylearn_three_phase_electrical_service_demo/schema.json
  building_ids:
  - Building_2
  - Building_3
  central_agent: false
  interface: entity
  topology_mode: static
  entity_encoding:
    enabled: true
    normalization: minmax_space
    clip: true
  reward_function: RewardFunction
  episodes: 2
  deterministic_finish: true
  simulation_start_time_step: 0
  simulation_end_time_step: 16
  episode_time_steps: 17
  export:
    mode: end
    export_kpis_on_episode_end: true
    final_episode_only: true
    kpis_final_episode_only: true
    timeseries_final_episode_only: true
    include_business_as_usual: true
    export_business_as_usual_timeseries: false
training:
  seed: 22
  steps_between_training_updates: 1
  target_update_interval: 2
pipeline:
- algorithm: TransformerMADDPG
  networks:
    transformer:
      d_model: 16
      nhead: 2
      num_layers: 1
      dim_feedforward: 32
  replay_buffer:
    capacity: 64
    batch_size: 4
  hyperparameters:
    gamma: 0.99
