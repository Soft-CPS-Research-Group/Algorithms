  experiment_name: cc2_matd3
  run_name: CC-L2 (per-building) over frozen MATD3 residual worker
  community_name: citylearn_15min
  description: Per-building price-signal CC (CCLevel2) over a frozen MATD3 residual-over-RBCCommunity
    worker. Uses CCRewardLevel2 (EV-service term) with per-building credit.
