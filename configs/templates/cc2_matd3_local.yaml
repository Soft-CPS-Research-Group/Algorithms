# CC-L2 (per-building price signal) over a FROZEN MATD3 residual worker.
#
# Pipeline:  CCLevel2 (PPO, per-building multiplier vector, learns) -> MATD3 (frozen, deterministic)
# The CC emits one multiplier per building; SignalAwareRBCCommunity applies each to its buildings
# perceived price (length-17 array routed per building). Reward = CCRewardLevel2 (Level1 + EV-service
# term) with per-building credit, so the CC is penalised for EV shortfall (unlike the L1 baseline).
#
# Encoding stays maddpg_v3_operational (frozen actors trained encoding); CCLevel2 reads its 17
# district + 6x17 per-building features by name from that encoding (all verified present).
#
# NOTE: per-building signals can concentrate damage on EV-heavy buildings. If EV service still
# suffers, tighten price_max (1.3 -> 1.15) and raise w_factor (0.6 -> 1.2) on the CCLevel2 stage,
# mirroring cc_matd3_evfix_local.yaml.
# BEFORE RUNNING: set the MATD3 stage exploration.params.frozen_checkpoint_path to the .pth.

