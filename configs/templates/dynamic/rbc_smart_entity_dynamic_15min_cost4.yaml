metadata:
  experiment_name: "rbc_smart_entity_dynamic_15min_cost4"
  run_name: "RBCSmart 15min cost4 baseline"
  community_name: "default_community"
  description: "Matching dynamic 15-minute RBCSmart baseline for Transformer MATD3"

tracking:
  mlflow_enabled: false
  log_level: INFO
  log_frequency: 256
  progress_updates_enabled: true
  progress_update_interval: 128
  system_metrics_enabled: true
  system_metrics_interval: 256

simulator:
  dataset_name: citylearn_three_phase_dynamic_assets_only_demo_15min_parquet
  dataset_path: ./datasets/citylearn_three_phase_dynamic_assets_only_demo_15min_parquet/schema.json
  central_agent: false
  interface: entity
  topology_mode: dynamic
  entity_encoding:
    enabled: true
    normalization: minmax_space
    profile: minmax_space
    clip: true
  reward_function: CostServiceCommunityDenseEVResidualRewardV54
  reward_function_kwargs:
    community_settlement_cost_weight: 1.55
    battery_throughput_penalty: 0.0015
  episodes: 1
  simulation_start_time_step: 0
  simulation_end_time_step: 3400
  episode_time_steps: 3401
  export:
    mode: end
    export_kpis_on_episode_end: true
    final_episode_only: true
    include_business_as_usual: true
    export_business_as_usual_timeseries: false

training:
  seed: 123
  steps_between_training_updates: 1
  target_update_interval: 0

pipeline:
  - algorithm: RBCSmartPolicy
    count: 1
    hyperparameters: {}

execution: null
