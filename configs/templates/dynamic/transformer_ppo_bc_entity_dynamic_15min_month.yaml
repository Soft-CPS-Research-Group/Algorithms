# Full-server 15-minute AgentTransformerPPO training with one month of RBC guidance.

metadata:
  experiment_name: "transformer_ppo_bc_entity_dynamic_15min_month"
  run_name: "Transformer PPO BC Entity Dynamic 15min Month"
  community_name: "citylearn_15min"
  description: "Full-year Transformer PPO behavior-cloning training over the dynamic 15-minute dataset"

runtime:
  log_dir: null
  job_dir: null
  mlflow_uri: null
  job_id: null
  run_id: null
  run_name: null
  tracking_uri: null
  experiment_id: null
  mlflow_run_url: null

tracking:
  mlflow_enabled: true
  tags:
    algorithm: AgentTransformerPPO
    recipe: transformer_ppo_bc_entity_dynamic_15min_month
    dataset_granularity: 15min
    topology_mode: dynamic
    teacher_policy: RBCCommunityPolicy
    teacher_duration: month
  log_level: "INFO"
  log_frequency: 512
  mlflow_step_sample_interval: 512
  mlflow_artifacts_profile: minimal
  progress_updates_enabled: true
  progress_update_interval: 128
  system_metrics_enabled: false
  system_metrics_interval: 32
  action_diagnostics_enabled: true
  action_diagnostics_detail: summary
  training_diagnostics_enabled: true
  training_diagnostics_detail: summary
  reward_diagnostics_enabled: true
  reward_diagnostics_detail: summary
  runtime_profiling_enabled: true
  runtime_profiling_interval: 512
  runtime_profiling_detail: summary
  progress_phase_updates_enabled: true
  progress_phase_start_step: 0
  progress_phase_end_step: null
  max_step_seconds: 240.0
  max_update_seconds: 2400.0
  stall_watchdog_enabled: true
  stall_watchdog_timeout_seconds: 2400.0
  stall_watchdog_exit_on_timeout: true
  stall_watchdog_repeat: false
  stall_watchdog_traceback_file: null
  stall_watchdog_context_interval_steps: 64
  resource_guard_enabled: true
  max_process_rss_mb: 88000.0
  min_available_ram_mb: 2048.0

checkpointing:
  resume_training: false
  checkpoint_run_id: null
  checkpoint_artifact: "transformer_ppo_checkpoint.pt"
  use_best_checkpoint_artifact: false
  reset_replay_buffer: false
  freeze_pretrained_layers: false
  fine_tune: false
  checkpoint_interval: null
  require_update_step: true
  require_initial_exploration_done: true

bundle:
  bundle_version: null
  description: null
  alias_mapping_path: null
  require_observations_envelope: false
  artifact_config: {}
  per_agent_artifact_config: {}

simulator:
  dataset_name: citylearn_three_phase_dynamic_assets_only_demo_15min_parquet
  dataset_path: ./datasets/citylearn_three_phase_dynamic_assets_only_demo_15min_parquet/schema.json
  central_agent: false
  interface: entity
  topology_mode: dynamic
  entity_encoding:
    enabled: true
    normalization: minmax_space
    clip: true
  reward_function: CostHardConstraintReward
  reward_function_kwargs: {}
  episodes: 1
  simulation_start_time_step: 0
  simulation_end_time_step: 35039
  episode_time_steps: 35040
  export:
    mode: end
    export_kpis_on_episode_end: true
    final_episode_only: true
    kpis_final_episode_only: true
    timeseries_final_episode_only: true
    include_business_as_usual: true
    export_business_as_usual_timeseries: false
    session_name: transformer_ppo_bc_15min_month
  wrapper_reward:
    enabled: false
    profile: cost_limits_v1
    clip_enabled: true
    clip_min: -10.0
    clip_max: 10.0
    squash: none

training:
  seed: 7
  steps_between_training_updates: 256
  target_update_interval: 0

topology:
  num_agents: null
  observation_dimensions: null
  action_dimensions: null
  action_space: null

pipeline:
  - algorithm: "AgentTransformerPPO"
    count: 1
    tokenizer_config_path: "configs/tokenizers/entity_default.json"
    transformer:
      d_model: 64
      nhead: 4
      num_layers: 2
      dim_feedforward: 128
      dropout: 0.1
    hyperparameters:
      learning_rate: 2.0e-4
      gamma: 0.99
      gae_lambda: 0.95
      clip_eps: 0.2
      ppo_epochs: 4
      minibatch_size: 64
      entropy_coeff: 0.03
      value_coeff: 0.5
      max_grad_norm: 1.0
      require_cuda: true
    behavior_cloning:
      enabled: true
      weight: 0.42
      min_weight: 0.0
      decay_start_step: 0
      decay_steps: 2880
      ev_multiplier: 24.0
      storage_multiplier: 0.18
      warm_start:
        policy: RBCCommunityPolicy
        deterministic: true
        noise_scale: 0.0
        phaseout_steps: 2880
        phaseout_mode: blend
        hyperparameters: {}

execution: null
