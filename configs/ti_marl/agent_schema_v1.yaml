version: ti_marl_agent_schema_v1
agent_entity_type: building

module_types:
  - building
  - storage
  - charger
  - ev
  - deferrable_appliance
  - pv
  - meter

observation_semantic_types:
  - local_energy
  - storage_state
  - ev_service
  - deferrable_state
  - local_constraint
  - community_signal
  - exogenous_forecast

action_group_types:
  - stationary_storage
  - ev_session
  - deferrable

dependencies:
  - dependency_id: storage_asset_to_group
    source_kind: asset_availability
    source_type: storage
    target_group_type: stationary_storage
    consequence: disable_group
    condition_states: [FAILED, MISSING]
  - dependency_id: storage_actuator_to_ports
    source_kind: actuator_channel
    source_type: storage
    target_group_type: stationary_storage
    consequence: invalidate_non_idle_ports
    condition_states: [FAILED, MISSING, STALE]
  - dependency_id: charger_connection_to_group
    source_kind: asset_connection
    source_type: charger
    target_group_type: ev_session
    consequence: invalidate_non_idle_ports
    condition_states: [MISSING]
  - dependency_id: charger_actuator_to_ports
    source_kind: actuator_channel
    source_type: charger
    target_group_type: ev_session
    consequence: invalidate_non_idle_ports
    condition_states: [FAILED, MISSING, STALE]
  - dependency_id: deferrable_actuator_to_ports
    source_kind: actuator_channel
    source_type: deferrable_appliance
    target_group_type: deferrable
    consequence: invalidate_non_idle_ports
    condition_states: [FAILED, MISSING, STALE]
  - dependency_id: sensor_channel_to_observations
    source_kind: sensor_channel
    source_type: "*"
    target_semantic_type: "*"
    consequence: remove_observation_part
    condition_states: [MISSING, FAILED]
  - dependency_id: community_link_to_observations
    source_kind: communication_link
    source_type: district
    target_semantic_type: community_signal
    consequence: remove_observation_part
    condition_states: [MISSING, STALE, FAILED]

local_constraints:
  - constraint_type: charging_headroom_kw
    source_feature: charging_building_headroom_kw
  - constraint_type: export_headroom_kw
    source_feature: charging_building_export_headroom_kw

shared_resources:
  - resource_id: community_meter
    resource_type: community_observation
    observable_only: true
